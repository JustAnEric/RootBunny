<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremiFy UI | Car View</title>
    <link rel="stylesheet" href="/apps/spotify/car.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Music Player -->
        <div class="music-player">
            <div class="song-info">
                <img src="https://via.placeholder.com/50" alt="Song Image">
                <div class="song-details">
                    <p class="song-title">Song Title</p>
                    <p class="song-artist">Artist Name</p>
                </div>
            </div>
            <div class="controls">
                <div class="top-controls">
                    <button class="prev-btn"><i class="fas fa-backward-step"></i></button>
                    <button class="play-pause-btn"><i class="fas fa-play"></i></button>
                    <button class="next-btn"><i class="fas fa-forward-step"></i></button>
                </div>
                <div class="progress-bar duration">
                    <div class="progress"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/apps/spotify/main.js" type="module"></script>
</body>
</html>
